<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitOS — AI Content Operating System</title>
<style>
:root{--bg:#06111d;--panel:#0b1b2b;--panel2:#10253a;--line:#203a52;--text:#edf5fd;--muted:#91a8bd;--a:#75e1c2;--b:#8db8ff;--warn:#ffd27e;--danger:#ff9daa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#173653 0,#06111d 42%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:18px 14px;background:#071522e8;border-right:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 18px;font-weight:800}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #37627f;border-radius:11px;color:var(--a)}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px;border-radius:10px;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text);border-color:#284962}.nav button.active{box-shadow:inset 3px 0 0 var(--a)}.foot{position:absolute;left:18px;right:18px;bottom:16px;color:var(--muted);font-size:10px}
.main{min-width:0}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:#06111dcc;backdrop-filter:blur(16px)}.crumb{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1500px;margin:0 auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.head h1{margin:4px 0;font-size:30px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted)}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:linear-gradient(180deg,#0c2032f0,#091828f0);border:1px solid var(--line);border-radius:16px;padding:16px}.card h2,.card h3{margin:0}.label,.small{color:var(--muted);font-size:11px}.value{font-size:29px;font-weight:800;margin:6px 0}.ok{color:var(--a)}.warn{color:var(--warn)}.danger{color:var(--danger)}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:10px}.badge.ok{color:#bdf5e2;background:#0a2721;border-color:#20584a}.badge.warn{color:#ffe7aa;background:#2a210d;border-color:#66511d}
.btn{border:1px solid var(--line);background:#0d2032;color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{border-color:#3b6380;background:#122b42}.btn.primary{background:var(--a);border-color:var(--a);color:#04131c;font-weight:700}.btn.danger{color:#ffd4d9}
.input,.select,.textarea{width:100%;background:#071522;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;outline:0}.textarea{min-height:110px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#497f9b}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:10px}.list{display:grid;gap:8px}.item{padding:11px;border:1px solid var(--line);border-radius:12px;background:#0a1928}.item strong{display:block}.item small{color:var(--muted)}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.step{border:1px solid var(--line);border-radius:10px;padding:9px;background:#081724}.step span{display:block;color:var(--muted);font-size:10px}.step b{font-size:18px}
.bar{height:7px;background:#071522;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a))}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow:auto}.col{background:#071522;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:320px}.col>h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.idea{padding:11px;border:1px solid #20405a;background:#0d2134;border-radius:12px;margin-bottom:8px}.idea p{margin:0 0 8px}
.platforms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.platform{padding:12px;border:1px solid var(--line);border-radius:13px;background:#091827}.platform h3{font-size:12px;margin:0 0 8px}.platform label{display:block;margin-top:8px}
.notice{padding:12px;border-radius:11px;border:1px solid #28506a;background:#0b2133;color:#ccecff}.notice.warn{border-color:#5e4c1d;background:#281f0d;color:#ffe8ab}
.timeline{display:grid;gap:7px}.event{display:grid;grid-template-columns:58px 1fr;gap:9px}.time{color:var(--muted);font-size:10px}.eventBody{border-left:2px solid #294861;padding-left:10px}
.modalBg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.form{display:grid;gap:10px}
.toast{position:fixed;right:18px;bottom:18px;z-index:30;background:#dffaf1;color:#06131c;padding:10px 13px;border-radius:10px;font-weight:700}.hidden{display:none!important}
@media(max-width:1050px){.app{grid-template-columns:78px 1fr}.brandText,.nav span,.foot{display:none}.nav button{text-align:center}.kpis{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(3,1fr)}}
.topContext{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.topContext .actions{margin-left:6px}@media(max-width:760px){.topContext{flex-wrap:wrap}}@media(max-width:620px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.brandText,.nav span{display:inline}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:10px;padding:7px 3px;text-align:center}.foot{display:none}.top{padding:10px 14px}.wrap{padding:14px}.head{display:block}.actions{margin-top:10px}.platforms{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,minmax(180px,1fr))}}
</style>
</head>

function load(){
  try{
    const v4=JSON.parse(localStorage.getItem(STORE)||"null");
    if(v4)return v4;
