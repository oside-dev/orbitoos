<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitOS — AI Content Operating System</title>
<style>
:root{--bg:#06111d;--panel:#0b1b2b;--panel2:#10253a;--line:#203a52;--text:#edf5fd;--muted:#91a8bd;--a:#75e1c2;--b:#8db8ff;--warn:#ffd27e;--danger:#ff9daa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#173653 0,#06111d 42%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:18px 14px;background:#071522e8;border-right:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 18px;font-weight:800}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #37627f;border-radius:11px;color:var(--a)}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px;border-radius:10px;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text);border-color:#284962}.nav button.active{box-shadow:inset 3px 0 0 var(--a)}.foot{position:absolute;left:18px;right:18px;bottom:16px;color:var(--muted);font-size:10px}
.main{min-width:0}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:#06111dcc;backdrop-filter:blur(16px)}.crumb{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1500px;margin:0 auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.head h1{margin:4px 0;font-size:30px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted)}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:linear-gradient(180deg,#0c2032f0,#091828f0);border:1px solid var(--line);border-radius:16px;padding:16px}.card h2,.card h3{margin:0}.label,.small{color:var(--muted);font-size:11px}.value{font-size:29px;font-weight:800;margin:6px 0}.ok{color:var(--a)}.warn{color:var(--warn)}.danger{color:var(--danger)}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:10px}.badge.ok{color:#bdf5e2;background:#0a2721;border-color:#20584a}.badge.warn{color:#ffe7aa;background:#2a210d;border-color:#66511d}
.btn{border:1px solid var(--line);background:#0d2032;color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{border-color:#3b6380;background:#122b42}.btn.primary{background:var(--a);border-color:var(--a);color:#04131c;font-weight:700}.btn.danger{color:#ffd4d9}
.input,.select,.textarea{width:100%;background:#071522;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;outline:0}.textarea{min-height:110px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#497f9b}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:10px}.list{display:grid;gap:8px}.item{padding:11px;border:1px solid var(--line);border-radius:12px;background:#0a1928}.item strong{display:block}.item small{color:var(--muted)}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.step{border:1px solid var(--line);border-radius:10px;padding:9px;background:#081724}.step span{display:block;color:var(--muted);font-size:10px}.step b{font-size:18px}
.bar{height:7px;background:#071522;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a))}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow:auto}.col{background:#071522;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:320px}.col>h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.idea{padding:11px;border:1px solid #20405a;background:#0d2134;border-radius:12px;margin-bottom:8px}.idea p{margin:0 0 8px}
.platforms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.platform{padding:12px;border:1px solid var(--line);border-radius:13px;background:#091827}.platform h3{font-size:12px;margin:0 0 8px}.platform label{display:block;margin-top:8px}
.notice{padding:12px;border-radius:11px;border:1px solid #28506a;background:#0b2133;color:#ccecff}.notice.warn{border-color:#5e4c1d;background:#281f0d;color:#ffe8ab}
.timeline{display:grid;gap:7px}.event{display:grid;grid-template-columns:58px 1fr;gap:9px}.time{color:var(--muted);font-size:10px}.eventBody{border-left:2px solid #294861;padding-left:10px}
.modalBg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.form{display:grid;gap:10px}
.toast{position:fixed;right:18px;bottom:18px;z-index:30;background:#dffaf1;color:#06131c;padding:10px 13px;border-radius:10px;font-weight:700}.hidden{display:none!important}
@media(max-width:1050px){.app{grid-template-columns:78px 1fr}.brandText,.nav span,.foot{display:none}.nav button{text-align:center}.kpis{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(3,1fr)}}
.topContext{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.topContext .actions{margin-left:6px}@media(max-width:760px){.topContext{flex-wrap:wrap}}@media(max-width:620px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.brandText,.nav span{display:inline}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:10px;padding:7px 3px;text-align:center}.foot{display:none}.top{padding:10px 14px}.wrap{padding:14px}.head{display:block}.actions{margin-top:10px}.platforms{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,minmax(180px,1fr))}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<input id="fileInput" type="file" accept="application/json,.json" class="hidden">
<input id="analyticsFileInput" type="file" accept="application/json,.json,text/csv,.csv" class="hidden">
<script>
const STORE="orbit-v4";
const platforms=["TikTok","Instagram Reels","YouTube Shorts","X","Facebook","LinkedIn"];
const stages=["Idea","Research","Strategy","Draft","Review","Approved","Scheduled"];
const pages=[
["overview","⌂","Overview"],["ideas","✦","Ideas"],["research","◌","Research"],["studio","✎","Content Studio"],
["calendar","□","Calendar"],["analytics","◔","Analytics"],["agents","◎","Agents"],["brand","◈","Brand"],["settings","⚙","Settings"]
];
const seed={
 version:4,
 workspace:{id:"workspace-orbitoos-local",name:"OrbitoOS Workspace",slug:"orbitoos-local",timezone:"UTC"},
 brand:{name:"OrbitoOS",voice:"Clear, direct, curious. Teach first; sell second.",audience:"Early-stage creators and small teams.",rules:["No invented facts or fake proof","One useful takeaway per post","Keep CTAs specific","Never auto-publish without an official adapter"]},
 ideas:[
  {id:"i1",title:"Why most content hooks fail in the first 2 seconds",pillar:"Education",audience:"Beginner creators",goal:"Reach",brief:"Explain the difference between a topic and a tension-driven hook.",stage:"Draft",score:87,variants:{}},
  {id:"i2",title:"Build one idea into six platform-native posts",pillar:"Systems",audience:"Solo marketers",goal:"Education",brief:"Show how one source idea changes by platform instead of being copy-pasted.",stage:"Research",score:81,variants:{}},
  {id:"i3",title:"The weekly content system that removes blank-page syndrome",pillar:"Workflow",audience:"Small teams",goal:"Engagement",brief:"A repeatable planning loop from idea to analytics.",stage:"Idea",score:72,variants:{}}
 ],
 signals:[
  {topic:"Hook specificity",signal:"Specific audience + specific tension beats generic topic framing.",score:92,source:"Local synthesis"},
  {topic:"Native formatting",signal:"Strong first beat plus visual rhythm matters in short form.",score:86,source:"OrbitOS heuristic"},
  {topic:"Repurposing",signal:"Reframe by platform intent instead of copy-pasting the same post.",score:84,source:"OrbitOS heuristic"},
  {topic:"Proof",signal:"Concrete examples increase trust more than broad claims.",score:79,source:"OrbitOS heuristic"}
 ],
 schedules:[],
 metrics:[
  {platform:"TikTok",views:38200,reach:38200,engagements:3209,engagement:8.4,followerDelta:310,growth:310,posts:8,isDemo:true,source:"local-seed",provider:"seed-fixture"},
  {platform:"Instagram Reels",views:29400,reach:29400,engagements:2234,engagement:7.6,followerDelta:205,growth:205,posts:7,isDemo:true,source:"local-seed",provider:"seed-fixture"},
  {platform:"YouTube Shorts",views:24100,reach:24100,engagements:1663,engagement:6.9,followerDelta:180,growth:180,posts:5,isDemo:true,source:"local-seed",provider:"seed-fixture"},
  {platform:"X",views:9100,reach:9100,engagements:382,engagement:4.2,followerDelta:84,growth:84,posts:14,isDemo:true,source:"local-seed",provider:"seed-fixture"},
  {platform:"Facebook",views:11200,reach:11200,engagements:426,engagement:3.8,followerDelta:96,growth:96,posts:6,isDemo:true,source:"local-seed",provider:"seed-fixture"},
  {platform:"LinkedIn",views:8700,reach:8700,engagements:496,engagement:5.7,followerDelta:121,growth:121,posts:4,isDemo:true,source:"local-seed",provider:"seed-fixture"}
 ],
 events:[
  ["09:12","Research Agent refreshed local signals"],
  ["09:05","Writing Agent prepared six platform variants"],
  ["08:41","Analytics fixtures normalized across six platforms"]
 ],
 settings:{costGuard:true,autoResearch:true,publishing:false,ai:{provider:"local",model:"",baseUrl:"http://localhost:11434/api"}}
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
  try{
    const v4=JSON.parse(localStorage.getItem(STORE)||"null");
    if(v4)return v4;
    const old=JSON.parse(localStorage.getItem("orbit-v3")||localStorage.getItem("orbit-v2")||"null");
    if(old)return Object.assign(clone(seed),old,{version:4});
  }catch{}
  return clone(seed);
}
let state=load();
save();
let publishingOperationsData=null;
let publishingOperationsWorkspaceId=null;
let publishingOperationsLoading=false;
let publishingOperationsError="";

let page="overview";
let selectedId=state.ideas[0]?.id||null;
function save(){if((state.runtime?.mode||"local")==="local")localStorage.setItem(STORE,JSON.stringify(state))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function toast(msg){const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function log(agent,msg){state.events.unshift([new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}),agent+" • "+msg]);state.events=state.events.slice(0,30);save()}
function btn(label,fn,primary=false,extra=""){return '<button class="btn '+(primary?"primary ":"")+extra+'" onclick="'+fn+'">'+esc(label)+"</button>"}
function updateAuthSnapshot(snapshot){
 state.auth={...(state.auth||{}),...(snapshot||{})};
 if(snapshot?.status==="signed_out")state.auth.membership=null;
}
function runtimeModeLabel(){
 const mode=state.runtime?.mode||"local";
 return mode==="authenticated-persistent"?"AUTHENTICATED":"LOCAL";
}
function nav(){
 const workspace=state.workspace?.name||"Local Workspace";
 const brandName=state.brand?.name||"No brand";
 const mode=runtimeModeLabel();
 return '<aside class="side"><div class="brand"><div class="mark">O</div><div class="brandText">OrbitOS<small>AI content operating system</small></div></div>'+
 '<div class="nav">'+pages.map(p=>'<button class="'+(page===p[0]?"active":"")+'" onclick="go(\''+p[0]+'\')">'+p[1]+' <span>'+p[2]+'</span></button>').join("")+'</div>'+
 '<div class="foot"><span class="badge '+(mode==="LOCAL"?"ok":"")+'">'+mode+'</span><br>'+esc(workspace)+'<br>'+esc(brandName)+'<br>Publishing locked</div></aside>';
}
function shell(title,sub,actions,body){
 const workspace=state.workspace?.name||"Local Workspace";
 const brandName=state.brand?.name||"No brand";
 const mode=runtimeModeLabel();
 document.getElementById("root").innerHTML=`<div class="app">${nav()}<main class="main"><header class="top"><div class="crumb">${esc(page.toUpperCase())}</div><div class="topContext"><span>${esc(workspace)}</span><span>•</span><span>${esc(brandName)}</span><span class="badge ${mode==="LOCAL"?"ok":""}">${mode}</span><div class="actions">${actions||""}</div></div></header><div class="wrap"><div class="head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div></div>${body}</div></main></div>`;
}
function go(p){page=p;render()}
function render(){
 const f={overview,ideas,research,studio,calendar,analytics,agents,brand,settings}[page]||overview;
 f();
 window.scrollTo({top:0,behavior:"smooth"});
}
function kpi(label,value,sub){return '<div class="card"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div><div class="small">'+esc(sub)+'</div></div>'}
function activeBrandKey(){return state.activeBrandId||state.brand?.id||null}
function visibleIdeas(){const id=activeBrandKey();return state.ideas.filter(i=>!id||i.metadata?.brandId===id)}
function visibleResearch(){const id=activeBrandKey();return state.research.filter(r=>!id||r.brandId===id)}
function visibleMetrics(){const id=activeBrandKey();return state.metrics.filter(m=>!id||m.brandId===id)}
function metricViews(m){return Number(m.views??0)}
function metricEngagements(m){return Number(m.engagements??m.engagement??0)}
function metricReach(m){return Number(m.reach??m.views??0)}
function metricRate(m){const d=metricReach(m);return d>0?(metricEngagements(m)/d)*100:0}
function learningEntries(){const id=activeBrandKey();return Array.isArray(state.learningInsights)?state.learningInsights.filter(x=>!id||x.brandId===id).slice(-5).reverse():[]}
async function runLearningNow(){
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.runLearning();
  log("Learning Agent","Generated advisory insights from current analytics");
  save();toast("Learning updated");render();
 }catch(error){toast(error.message||"Learning run failed")}
}
function overview(){
 const active=visibleIdeas().filter(x=>x.stage!=="Archived").length;
 const approved=visibleIdeas().filter(x=>x.stage==="Approved").length;
 const activeIdeas=visibleIdeas();
 const avg=Math.round(activeIdeas.reduce((a,x)=>a+x.score,0)/Math.max(1,activeIdeas.length));
 const draft=visibleIdeas().filter(x=>x.stage==="Draft").length;
 const cards='<div class="grid kpis">'+kpi("Active ideas",active,"local records")+kpi("Ready to publish",approved,"human-approved only")+kpi("Draft queue",draft,"editing work")+kpi("Avg opportunity",avg+"/100","heuristic score")+'</div>';
 const pipe='<div class="card"><div class="row"><h2>Operating pipeline</h2><span class="badge ok">LOCAL</span></div><div class="pipeline" style="margin-top:12px">'+stages.slice(0,6).map((s,i)=>'<div class="step"><span>'+s+'</span><b>'+activeIdeas.filter(x=>x.stage===s).length+'</b></div>').join("")+'</div><div class="small" style="margin-top:9px">Idea → Research → Strategy → Draft → Review → Approved. Schedule remains a separate execution step.</div></div>';
 const right='<div class="card"><div class="row"><h2>System guardrails</h2><span class="badge warn">FREE-FIRST</span></div><div class="notice" style="margin-top:10px">No paid provider calls. No social account credentials. No automatic external publishing. Human approval remains mandatory.</div><div class="small" style="margin-top:10px">Runtime v4 • local persistence • portable JSON backup</div></div>';
 const activity='<div class="card"><div class="row"><h2>Activity</h2><span class="badge">EVENT LOG</span></div><div class="timeline" style="margin-top:10px">'+state.events.slice(0,8).map(e=>'<div class="event"><div class="time">'+esc(e[0])+'</div><div class="eventBody">'+esc(e[1])+'</div></div>').join("")+'</div></div>';
 const learning='<div class="card"><div class="row"><h2>Learning loop</h2><span class="badge '+(learningEntries().length?'ok':'warn')+'">'+(learningEntries().length?'RUNTIME':'WAITING')+'</span></div><div class="list" style="margin-top:10px">'+(learningEntries().length?learningEntries().slice(0,3).map((x,i)=>'<div class="item"><strong>'+(i+1)+". "+esc(x.title)+'</strong><small>'+esc(x.detail)+'</small></div>').join(""):'<div class="small">Run Learning from Analytics after metrics are available.</div>')+'</div></div>';
 shell("Command Center","One idea → research → platform variants → review → schedule → analytics → learning",btn("+ New idea","newIdea()",true)+btn("Run local workflow","runWorkflow()"),cards+'<div class="grid two" style="margin-top:14px">'+pipe+right+'</div><div class="grid two" style="margin-top:14px">'+activity+learning+"</div>");
}
function ideas(){
 let cols=stages.map(s=>'<div class="col"><h3>'+s+'</h3>'+visibleIdeas().filter(x=>x.stage===s).map(i=>'<div class="idea"><p><strong>'+esc(i.title)+'</strong></p><div class="small">'+esc(i.audience)+' • '+esc(i.goal)+'</div><div class="row" style="margin-top:8px"><span class="badge">'+i.score+'/100</span>'+btn("Open","openIdea('"+i.id+"')")+'</div></div>').join("")||'<div class="small">No items</div>'+"</div>").join("");
 shell("Ideas","Source material for the entire operating system",btn("+ New idea","newIdea()",true)+btn("Advance first","advanceSelected()"),'<div class="kanban">'+cols+'</div><div class="card" style="margin-top:14px"><div class="notice">The content pipeline is intentionally reversible. Approval is a human gate; publishing is a separate adapter.</div></div>');
}
function research(){
 const cards=visibleResearch().flatMap(r=>r.signals||[]).map(s=>'<div class="card"><div class="row"><span class="badge">'+esc(s.source)+'</span><b class="ok">'+s.score+'</b></div><h3 style="margin-top:10px">'+esc(s.topic)+'</h3><p class="small">'+esc(s.signal)+'</p><div class="bar"><i style="width:'+s.score+'%"></i></div></div>').join("");
 shell("Research","Local signals now; external research providers are adapter slots","",'<div class="grid three">'+cards+'</div><div class="card" style="margin-top:14px"><div class="row"><h2>Provider contract</h2><span class="badge ok">READY FOR ADAPTER</span></div><table class="table" style="margin-top:9px"><tr><th>Input</th><th>Output</th><th>Current</th></tr><tr><td>Topic + audience</td><td>Signals + evidence labels + opportunity score</td><td>Local heuristic</td></tr><tr><td>External provider</td><td>Structured evidence + citations</td><td>Not connected</td></tr></table></div>');
}
function currentIdea(){const ideas=visibleIdeas();return ideas.find(x=>x.id===selectedId)||ideas[0]}
function studio(){
 const i=currentIdea();
 if(!i){shell("Content Studio","Create an idea first","",'<div class="empty">No idea available.</div>');return}
 const hasVariants=platforms.every(p=>Boolean(i.variants&&i.variants[p]));
 const selector='<select class="select" style="max-width:420px" onchange="selectedId=this.value;render()">'+visibleIdeas().map(x=>'<option value="'+esc(x.id)+'" '+(x.id===i.id?"selected":"")+'>'+esc(x.title)+'</option>').join("")+'</select>';
 const generationAction=hasVariants
   ? btn("Regenerate","regenerateVariants('"+i.id+"')")
   : btn("Generate variants","regenerateVariants('"+i.id+"')",true);
 const approveAction=hasVariants&&["Draft","Review"].includes(i.stage)
   ? btn("Approve","approve('"+i.id+"')",true)
   : "";
 const master='<div class="card"><div class="row"><h2>'+esc(i.title)+'</h2><div><span class="badge">'+esc(i.stage)+'</span> '+(i.stage==="Approved"?'<span class="badge ok">APPROVED</span>':"")+'</div></div><p class="small">'+esc(i.brief)+'</p><div class="row" style="margin-top:10px"><div>'+selector+'</div><div class="actions">'+generationAction+approveAction+'</div></div></div>';
 if(!hasVariants){
   shell("Content Studio","Prepare a real runtime draft before editing platform variants",master+'<div class="notice" style="margin-top:14px">This idea has no generated variants yet. Generate through the Orbit Runtime to create the canonical content item and six platform variants.</div>');
   return;
 }
 const variants=platforms.map(p=>{
   const variant=i.variants[p]||{};
   return '<div class="platform"><div class="row"><h3>'+p+'</h3><span class="badge ok">LOCAL</span></div>'+
    '<label class="small">Hook<textarea class="textarea" rows="3" onchange="editVariant(\''+i.id+'\',\''+p+'\',\'hook\',this.value)">'+esc(variant.hook)+'</textarea></label>'+
    '<label class="small">Body<textarea class="textarea" rows="5" onchange="editVariant(\''+i.id+'\',\''+p+'\',\'body\',this.value)">'+esc(variant.body)+'</textarea></label>'+
    '<label class="small">CTA<input class="input" value="'+esc(variant.cta)+'" onchange="editVariant(\''+i.id+'\',\''+p+'\',\'cta\',this.value)"></label>'+
    '<label class="small">Public media URL (HTTPS)<input class="input" type="url" placeholder="https://cdn.example.com/media.jpg" value="'+esc(variant.mediaUrl)+'" onchange="editVariant(\''+i.id+'\',\''+p+'\',\'mediaUrl\',this.value)"></label>'+
    '<p class="small">For Instagram, use a public image/video URL that the platform can fetch without login or cookies.</p>'+
    '</div>';
 }).join("");
 shell("Content Studio","Editable platform-native variants with local persistence",btn("Back to Ideas","go('ideas')")+approveAction,master+'<div class="platforms" style="margin-top:14px">'+variants+'</div><div class="notice" style="margin-top:14px">Editing is saved through the Orbit Runtime. No render-time mutation is used.</div>');
}
async function scheduleVariant(id,platform){
 document.getElementById("modalRoot").innerHTML='<div class="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2>Schedule '+esc(platform)+'</h2>'+btn("Close","closeModal()")+'</div><div class="form" style="margin-top:12px"><label>Publish time<input class="input" id="scheduleAt" type="datetime-local"></label></div><div class="actions" style="justify-content:flex-end;margin-top:12px">'+btn("Save schedule","confirmSchedule('"+id+"','"+platform+"')",true)+'</div></div></div>';
 const field=document.getElementById("scheduleAt");
 const d=new Date(Date.now()+24*60*60*1000);
 d.setHours(9,0,0,0);
 field.value=d.toISOString().slice(0,16);
}
async function confirmSchedule(id,platform){
 const field=document.getElementById("scheduleAt");
 if(!field.value)return toast("Schedule time required");
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.scheduleIdeaVariant({ideaId:id,platform,scheduledAt:new Date(field.value).toISOString()});
  closeModal();
  log("Publishing Agent","Prepared schedule for "+platform);
  save();toast("Schedule saved");render();

  state=await window.orbitCore.createDraft(i,state.brand);
  selectedId=i.id;
  log("Orchestrator",i.title+" → Draft through Orbit Runtime");
  save();render();
 }catch(error){toast(error.message||"Orbit Runtime failed")}
}
async function runWorkflow(){
 const brief=document.getElementById("brief");
 if(brief&&brief.value.trim()){await createIdeaFromBrief(brief.value.trim());return}
 const i=state.ideas.find(x=>x.stage==="Idea"||x.stage==="Research"||x.stage==="Strategy");
 if(!i){toast("No eligible idea is waiting for the local workflow");return}
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.createDraft(i,state.brand);
  selectedId=i.id;
  log("Orchestrator","Ran the local pipeline for "+i.title);
  save();render();
 }catch(error){toast(error.message||"Orbit Runtime failed")}
}
async function createIdeaFromBrief(title){
 const idea={id:"i"+Date.now(),title,pillar:"Workflow",audience:"General audience",goal:"Education",brief:"Generated from Command Center brief.",stage:"Draft",score:88,variants:{}};
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.createDraft(idea,state.brand);
  selectedId=idea.id;
  log("Orchestrator","Processed brief through Orbit Runtime");
  log("Writing Agent","Prepared six platform variants");
  save();go("studio");
 }catch(error){toast(error.message||"Orbit Runtime failed")}
}
async function regenerateVariants(id){
 const i=state.ideas.find(x=>x.id===id);if(!i)return;
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.createDraft({...i,stage:"Draft"},state.brand);
  selectedId=id;
  log("Writing Agent","Regenerated variants through Orbit Runtime for "+i.title);
  save();render();
 }catch(error){toast(error.message||"Orbit Runtime failed")}
}
async function editVariant(id,p,k,v){
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.updateContentVariant({ideaId:id,platform:p,changes:{[k]:v}});
  selectedId=id;
  save();
 }catch(error){toast(error.message||"Variant update failed")}
}
async function approve(id){
 const i=state.ideas.find(x=>x.id===id);if(!i)return;
 try{
  await window.orbitCoreReady;
  state=await window.orbitCore.approveIdea(id);
  selectedId=id;
  log("Review Agent","Human approval recorded through Orbit Runtime for "+i.title);
  save();toast("Approved for scheduling");go("calendar");
 }catch(error){toast(error.message||"Approval failed")}
}
function approveFirst(){const i=state.ideas.find(x=>x.stage==="Draft"||x.stage==="Review");if(i)approve(i.id);else toast("No draft waiting for approval")}
async function saveBrand(){
 const nextBrand={...state.brand,name:document.getElementById("brandName").value.trim()||state.brand.name,voice:document.getElementById("brandVoice").value.trim(),audience:document.getElementById("brandAudience").value.trim()};
 try{await window.orbitCoreReady;state=await window.orbitCore.updateBrand(nextBrand);log("Brand","Updated brand memory through Orbit Runtime");save();render()}catch(error){toast(error.message||"Brand update failed")}
}
async function toggleRule(i,on){
 const rules=[...(state.brand.rules||[])];
 if(!rules[i])return;
 rules[i]=on?rules[i].replace(" [disabled]",""):rules[i].replace(" [disabled]","")+" [disabled]";
 try{await window.orbitCoreReady;state=await window.orbitCore.updateBrand({...state.brand,rules});save();render()}catch(error){toast(error.message||"Guardrail update failed")}
}
function exportData(){const data={version:4,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="orbitoos-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Backup exported")}
async function saveAiSettings(){
 const config={provider:document.getElementById("aiProvider").value,model:document.getElementById("aiModel").value.trim(),baseUrl:document.getElementById("aiBaseUrl").value.trim()};
 try{await window.orbitCoreReady;state=await window.orbitCore.setAiConfig(config);toast("AI settings saved");render()}catch(error){toast(error.message||"AI settings failed")}
}
function consumeInstagramOAuthResult(){
 let url;
 try{url=new URL(window.location.href)}catch{return}
 if(url.searchParams.get("social_connection")!=="instagram")return;
 const result=url.searchParams.get("result")||"";
 url.searchParams.delete("social_connection");
 url.searchParams.delete("result");
 window.history.replaceState({},document.title,url.pathname+(url.search?url.search:"")+url.hash);
 const messages={
  connected:"Instagram account connected securely.",
  denied:"Instagram connection was cancelled.",
  invalid_state:"The Instagram connection request expired or was invalid. Try again.",
  missing_code:"Instagram did not return an authorization code.",
  token_exchange_failed:"Instagram could not exchange the authorization code. Please try again.",
  long_lived_token_failed:"Instagram did not provide a long-lived access token.",
  profile_lookup_failed:"OrbitOS could not verify the Instagram account.",
  account_save_failed:"OrbitOS could not save the Instagram account.",
  token_storage_failed:"Secure token storage failed. The account was not marked connected.",
  connection_finalize_failed:"OrbitOS could not finalize the connection. Please reconnect after checking setup.",
  provider_request_failed:"Instagram could not complete the connection. Please try again."
 };
 toast(messages[result]||"Instagram connection did not finish. Please try again.");
}

async function importAnalyticsReportPrompt(){
 const input=document.getElementById("analyticsFileInput");
 if(!input)return;
 input.value="";
 input.click();
}
async function resetData(){
 if(!confirm("Reset local OrbitOS data?"))return;
 try{await window.orbitCoreReady;state=await window.orbitCore.importState(JSON.stringify(seed));selectedId=state.ideas[0]?.id||null;toast("OrbitOS reset");render()}catch(error){toast(error.message||"Reset failed")}
}
document.getElementById("fileInput").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const p=JSON.parse(r.result);if(!p.state||!p.state.ideas)throw new Error();await window.orbitCoreReady;state=await window.orbitCore.importState(JSON.stringify(p.state));selectedId=state.ideas[0]?.id||null;toast("Backup restored");render()}catch(error){toast(error.message||"Invalid OrbitOS backup")}};r.readAsText(f)});
document.getElementById("analyticsFileInput").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{await window.orbitCoreReady;state=await window.orbitCore.importAnalyticsReport(String(r.result),{source:f.name,provider:f.type||"imported-report"});selectedId=state.ideas[0]?.id||null;toast("Analytics report imported");render()}catch(error){toast(error.message||"Invalid analytics report")}};r.readAsText(f)});
window.orbitCoreReady=import("./src/runtime/application-browser-bridge.mjs")
 .then(async ({createOrbitApplicationBrowserBridge})=>{
   window.orbitCore=await createOrbitApplicationBrowserBridge({storage:window.localStorage,key:STORE});
   return window.orbitCore;
 })
 .catch(error=>{
   console.error("Orbit Runtime bridge failed",error);
   toast("Core runtime unavailable");
   throw error;
 });
async function boot(){
 try{
  await window.orbitCoreReady;
  const stored=localStorage.getItem(STORE);
  state=stored
    ? await window.orbitCore.snapshot()
    : await window.orbitCore.importState(JSON.stringify(seed));
  state.runtime=await window.orbitCore.getEnvironment();
  updateAuthSnapshot(await window.orbitCore.getAuthSnapshot());
  selectedId=state.ideas[0]?.id||null;
  if(!window.orbitAuthSubscription){
   window.orbitAuthSubscription=window.orbitCore.onAuthStateChange(async (_event,authSnapshot)=>{
    try{
     state=await window.orbitCore.refresh();
     updateAuthSnapshot(authSnapshot);
     render();
    }catch(error){
     toast(error.message||"Authentication state refresh failed");
    }
   });
  }
  render();
   consumeInstagramOAuthResult();
 }catch(error){
  console.error("OrbitOS boot failed",error);
  document.getElementById("root").innerHTML='<div class="app"><main class="main"><div class="wrap"><div class="card"><h1>OrbitOS runtime unavailable</h1><p class="small">The canonical browser runtime could not be initialized.</p></div></div></main></div>';
 }
}
boot();
</script>
