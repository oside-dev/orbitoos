<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrbitOS — AI Content Operating System</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--panel2:#122238;--line:#203650;--text:#eaf2fb;--muted:#90a5ba;--accent:#76e1c4;--blue:#91b9ff;--warn:#ffd27d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#081321;border-right:1px solid var(--line);padding:20px}.logo{display:flex;gap:10px;align-items:center;font-weight:800}.logoMark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #37627f;border-radius:10px;color:var(--accent)}.tag{font-size:10px;color:var(--muted);font-weight:500}.nav{display:grid;gap:4px;margin-top:22px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;text-align:left}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.sideNote{position:absolute;bottom:16px;color:var(--muted);font-size:10px;max-width:190px}
.main{max-width:1500px;width:100%;margin:auto;padding:26px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.header h1{font-size:28px;line-height:1.1;margin:5px 0}.header p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:700}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.4fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.cardHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.cardHead h2{font-size:14px;margin:0}.label,.small{color:var(--muted);font-size:11px}.value{font-size:28px;font-weight:800;margin:7px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--muted);font-size:10px}.ok{color:var(--accent)}.warn{color:var(--warn)}
.command{display:grid;grid-template-columns:1fr auto;gap:8px}.input,textarea{width:100%;background:#081420;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;outline:0}.pipeline{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:13px}.stage{border:1px solid var(--line);border-radius:9px;padding:9px;background:#091624}.stage b{display:block;font-size:20px;margin-top:4px}.agents{display:grid;gap:7px}.agent{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px}.row{display:grid;grid-template-columns:25px 1fr auto;gap:9px;padding:9px 0;border-bottom:1px solid #17283d}.bar{height:7px;background:#091523;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}.modalBack{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.form{display:grid;gap:9px}.toast{position:fixed;right:18px;bottom:18px;background:#def9f1;color:#06121d;padding:10px 13px;border-radius:9px;font-weight:700;z-index:20}
@media(max-width:900px){.app{grid-template-columns:72px 1fr}.side{padding:15px 9px}.logoText,.nav button span,.sideNote{display:none}.nav button{text-align:center}.main{padding:20px}.kpis{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.logoText,.nav button span{display:inline}.nav{grid-template-columns:repeat(4,1fr)}.header{display:block}.actions{margin-top:10px}.pipeline{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="toastRoot"></div>
<script>
const KEY="orb-zerobudget-v1";
const seed={
  ideas:[
    {id:1,title:"12-minute desk-break workout",pillar:"Training",status:"draft",score:88},
    {id:2,title:"Protein timing myth",pillar:"Nutrition",status:"research",score:81},
    {id:3,title:"First pull-up at 38",pillar:"Stories",status:"review",score:92},
    {id:4,title:"Train before your inbox",pillar:"Habits",status:"idea",score:74},
    {id:5,title:"3 mobility drills for tight hips",pillar:"Training",status:"scheduled",score:85}
  ],
  activity:[
    ["Research","Micro-workout signal +42%","2m"],
    ["Writing","6 platform variants prepared","9m"],
    ["Review","Draft passed brand guardrails","21m"],
    ["Analytics","Demo metrics refreshed","1h"]
  ]
};
let state=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[m]))}
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>r.innerHTML="",2200)}
const pages=[["⌂","Overview","home"],["✦","Ideas","ideas"],["◌","Research","research"],["✎","Content Studio","studio"],["□","Calendar","calendar"],["◔","Analytics","analytics"],["◎","Agents","agents"],["◈","Brand","brand"],["⚙","Settings","settings"]];
function nav(active){return '<aside class="side"><div class="logo"><div class="logoMark">O</div><div class="logoText">OrbitOS<div class="tag">AI content operating system</div></div></div><nav class="nav">'+pages.map(p=>'<button class="'+(active===p[2]?"active":"")+'" onclick="go(\''+p[2]+'\')"><span>'+p[0]+'</span> <span>'+p[1]+'</span></button>').join("")+'</nav><div class="sideNote">ZERO-BUDGET MODE<br>Local-first. No paid API required. No external posts.</div></aside>'}
function shell(active,title,desc,body){document.getElementById("app").innerHTML='<div class="app">'+nav(active)+'<main class="main"><header class="header"><div><div class="eyebrow">OrbitOS / '+esc(active)+'</div><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div><div class="actions"><button class="btn" onclick="go(\'settings\')">Free-first</button><button class="btn primary" onclick="openIdea()">+ New idea</button></div></header>'+body+'</main></div>'}
function home(){
const avg=Math.round(state.ideas.reduce((a,x)=>a+x.score,0)/state.ideas.length);
shell("home","Command Center","One operating loop: idea → research → draft → review → schedule → analytics → learning.",
'<section class="grid kpis"><div class="card"><div class="label">Pipeline</div><div class="value">'+state.ideas.length+'</div><div class="small">Local records</div></div><div class="card"><div class="label">Needs review</div><div class="value">'+state.ideas.filter(x=>x.status==="review").length+'</div><div class="small">Human gate</div></div><div class="card"><div class="label">Scheduled</div><div class="value">'+state.ideas.filter(x=>x.status==="scheduled").length+'</div><div class="small">Publishing simulated</div></div><div class="card"><div class="label">Avg opportunity</div><div class="value">'+avg+'</div><div class="ok">/100</div></div></section>'+
'<section class="grid two" style="margin-top:14px"><div class="card"><div class="cardHead"><h2>AI Command Center</h2><span class="badge ok">LOCAL</span></div><div class="command"><input id="brief" class="input" placeholder="Create a short video about building habits"><button class="btn primary" onclick="runWorkflow()">Run</button></div><div class="small" style="margin-top:8px">This is deterministic local logic. No paid model or social API is called.</div><div class="pipeline">'+["Idea","Research","Strategy","Draft","Review","Schedule","Learn"].map((x,i)=>'<div class="stage"><div class="small">'+x+'</div><b>'+(i<3?"✓":"—")+'</b></div>').join("")+'</div></div>'+
'<div class="card"><div class="cardHead"><h2>Agent health</h2><span class="badge ok">READY</span></div>'+["Orchestrator","Research","Strategy","Writing","Creative","Review","Publishing","Analytics","Learning"].map(x=>'<div class="agent"><span><i class="dot"></i>'+x+'<div class="small">'+(x==="Publishing"?"Simulated adapter":"Local adapter")+'</div></span><span class="badge '+(x==="Publishing"?"warn":"ok")+'">'+(x==="Publishing"?"DEMO":"READY")+'</span></div>').join("")+'</div></section>'+
'<section class="grid two" style="margin-top:14px"><div class="card"><div class="cardHead"><h2>Activity</h2><span class="badge">PERSISTED LOCALLY</span></div>'+state.activity.map(a=>'<div class="row"><div>•</div><div><b>'+esc(a[1])+'</b><div class="small">'+esc(a[0])+'</div></div><div class="small">'+esc(a[2])+'</div></div>').join("")+'</div>'+
'<div class="card"><div class="cardHead"><h2>Learning loop</h2><span class="badge">DEMO DATA</span></div><div class="row"><div>1</div><div><b>Tutorials drive saves</b><div class="small">3.4 saves / 100 views vs 1.1 motivation</div></div></div><div class="row"><div>2</div><div><b>Audience peaks 7–9pm</b><div class="small">Use for short-form experiments</div></div></div><div class="row"><div>3</div><div><b>Time scarcity is top objection</b><div class="small">Lead with the constraint</div></div></div></div></section>');
}
function ideas(){
shell("ideas","Ideas","Create and advance content ideas without any paid service.",
'<section class="card"><div class="cardHead"><h2>Pipeline</h2><button class="btn" onclick="openIdea()">+ Create</button></div><div class="tableWrap"><table><tr><th>Idea</th><th>Pillar</th><th>Status</th><th>Score</th><th></th></tr>'+state.ideas.map((x,i)=>'<tr><td><b>'+esc(x.title)+'</b></td><td>'+esc(x.pillar)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>'+x.score+'/100</td><td><button class="btn" onclick="advance('+i+')">Advance</button></td></tr>').join("")+'</table></div></section>');
}
function research(){
const rows=[["Micro-workouts","+42% WoW",91],["Strength 35+"," +28% MoM",86],["Protein myths","2.1x saves",78],["Silent gym vlogs","+19% watch time",64],["Time scarcity","34% comments",88],["LinkedIn fitness","6.2% engagement",83]];
shell("research","Research","Research signals are simulated until a real free data provider is attached.",
'<section class="grid three">'+rows.map(r=>'<div class="card"><div class="cardHead"><h2>'+esc(r[0])+'</h2><span class="badge">DEMO</span></div><div class="value">'+r[2]+'</div><div class="small">'+esc(r[1])+'</div><div class="bar"><span style="width:'+r[2]+'%"></span></div></div>').join("")+'</section>');
}
function studio(){
const x=state.ideas[0];
shell("studio","Content Studio","One idea becomes multiple platform-native versions. Generation is local in v0.1.",
'<section class="grid two"><div class="card"><div class="cardHead"><h2>'+esc(x.title)+'</h2><span class="badge">'+x.status+'</span></div><div class="small">Pillar: '+esc(x.pillar)+' · Opportunity '+x.score+'/100</div><div class="card" style="margin-top:12px"><div class="cardHead"><h2>Short video variant</h2><span class="badge ok">SIMULATED</span></div><b>Hook</b><p>No time to train? You have 12 minutes.</p><b>Body</b><p class="small">Four 3-minute blocks. Put the time constraint on screen before the first movement.</p><b>CTA</b><p class="small">Save this for later.</p></div></div><div class="card"><div class="cardHead"><h2>Creative brief</h2><span class="badge">LOCAL</span></div><p class="small">9:16 vertical, natural light, real environment, bold captions, fast cuts, single accent treatment.</p><p class="small">Targets: TikTok · Instagram Reels · YouTube Shorts · X · Facebook · LinkedIn</p><button class="btn primary" onclick="toast('Regeneration is local simulation')">Regenerate</button> <button class="btn" onclick="advance(0)">Approve</button></div></section>');
}
function calendar(){
shell("calendar","Calendar","Scheduling is modeled locally; external publishing is intentionally disabled.",
'<section class="grid three">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>'<div class="card"><div class="cardHead"><h2>'+d+'</h2><span class="small">'+(i+1)+'</span></div>'+(i<5?'<span class="badge '+(i===2?"ok":"")+'">'+(i===2?"Scheduled":"Draft")+'</span><p class="small">'+esc(state.ideas[i%state.ideas.length].title)+'</p>':'<div class="small">No post</div>')+'</div>').join("")+'</section>');
}
function analytics(){
shell("analytics","Analytics","Demo metrics keep the learning loop usable before platform APIs are connected.",
'<section class="grid kpis"><div class="card"><div class="label">30d views</div><div class="value">184k</div><div class="ok">+18.4%</div></div><div class="card"><div class="label">Engagement</div><div class="value">5.8%</div><div class="ok">+0.7 pts</div></div><div class="card"><div class="label">Follower growth</div><div class="value">+7.2%</div><div class="ok">MoM</div></div><div class="card"><div class="label">Top format</div><div class="value">Tutorial</div><div class="small">save-heavy</div></div></section><section class="grid two" style="margin-top:14px"><div class="card"><div class="cardHead"><h2>Performance curve</h2><span class="badge">DEMO</span></div>'+[72,58,80,64,92,76,97,88,104,96,118,110].map((v,i)=>'<div style="display:grid;grid-template-columns:30px 1fr 38px;gap:8px;align-items:center;margin:8px 0"><span class="small">W'+(i+1)+'</span><div class="bar"><span style="width:'+Math.min(v,120)/1.2+'%"></span></div><span class="small">'+v+'k</span></div>').join("")+'</div><div class="card"><div class="cardHead"><h2>Recommendations</h2><span class="badge ok">LEARNING</span></div><div class="row"><div>1</div><div><b>Lead with the constraint</b><div class="small">Make “12 minutes” visible immediately.</div></div></div><div class="row"><div>2</div><div><b>Repurpose tutorials</b><div class="small">Convert winners into other formats.</div></div></div><div class="row"><div>3</div><div><b>Keep approval human</b><div class="small">Until external adapters are trusted.</div></div></div></div></section>');
}
function agents(){shell("agents","Agent Center","Specialist roles are isolated behind local adapter interfaces.",'<section class="grid three">'+["Orchestrator","Research","Strategy","Writing","Creative","Review","Publishing","Analytics","Learning"].map(x=>'<div class="card"><div class="cardHead"><h2>'+x+'</h2><span class="badge '+(x==="Publishing"?"warn":"ok")+'">'+(x==="Publishing"?"DEMO":"READY")+'</span></div><div class="small">'+(x==="Publishing"?"No external publish call":"Local execution ready")+'</div><div class="bar" style="margin-top:10px"><span style="width:'+(x==="Publishing"?45:88)+'%"></span></div></div>').join("")+'</section>')}
function brand(){shell("brand","Brand Memory","The rules every future agent should read before generating content.",'<section class="grid two"><div class="card"><div class="cardHead"><h2>Northwind Fitness</h2><span class="badge ok">ACTIVE</span></div><p>Direct, evidence-led, warm. Coach energy without hype.</p><p class="small">Audience: busy professionals 25–40 seeking sustainable strength and energy.</p><p class="small">Pillars: Training science · Habit design · Nutrition · Stories · Behind the scenes</p></div><div class="card"><div class="cardHead"><h2>Guardrails</h2><span class="badge warn">REVIEW</span></div><p class="small">No medical/cure claims, body shaming, supplement guarantees, crash diets, competitor bashing.</p><p class="small">Visual: natural light, real people, bold captions, one accent color.</p></div></section>')}
function settings(){shell("settings","Settings","Free-first controls. No paid integration is required by the core app.",'<section class="grid two"><div class="card"><div class="cardHead"><h2>AI generation</h2><span class="badge ok">LOCAL</span></div><p class="small">Deterministic content generator. Zero paid model calls.</p></div><div class="card"><div class="cardHead"><h2>Social publishing</h2><span class="badge warn">OFF</span></div><p class="small">No account is connected and nothing is posted externally.</p></div><div class="card"><div class="cardHead"><h2>Persistence</h2><span class="badge ok">LOCAL</span></div><p class="small">Workspace state persists in browser storage.</p></div><div class="card"><div class="cardHead"><h2>Source control</h2><span class="badge ok">GITHUB</span></div><p class="small">The product is source-code-first and independent of paid AI builders.</p></div></section>')}
function go(k){({home,ideas,research,studio,calendar,analytics,agents,brand,settings}[k]||home)()}
function openIdea(){document.body.insertAdjacentHTML("beforeend",'<div class="modalBack" id="modal"><div class="modal"><h2>Create idea</h2><div class="form"><input id="it" class="input" placeholder="Idea title"/><input id="ip" class="input" placeholder="Content pillar"/><textarea id="id" rows="5" class="input" placeholder="Brief"></textarea></div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="modal.remove()">Cancel</button><button class="btn primary" onclick="createIdea()">Create</button></div></div></div>')}
function createIdea(){const t=it.value.trim();if(!t)return toast("Title required");state.ideas.unshift({id:Date.now(),title:t,pillar:ip.value.trim()||"General",status:"idea",score:80});state.activity.unshift(["Command Center","Created "+t,"now"]);save();modal.remove();toast("Idea added");go("ideas")}
function advance(i){const order=["idea","research","strategy","draft","review","approved","scheduled","published","learning"];const x=state.ideas[i],n=order.indexOf(x.status);x.status=order[Math.min(n+1,order.length-1)];state.activity.unshift(["Orchestrator",x.title+" → "+x.status,"now"]);save();toast("Moved to "+x.status);go("ideas")}
function runWorkflow(){const v=document.getElementById("brief").value.trim();if(!v)return toast("Enter a brief");state.ideas.unshift({id:Date.now(),title:v,pillar:"AI-generated",status:"research",score:90});state.activity.unshift(["Orchestrator","Brief processed locally","now"],["Research","Opportunity score assigned","now"],["Writing","Platform variants prepared","now"]);save();toast("Workflow completed locally");go("studio")}
go("home");
</script>
</body>
</html>
