name: OrbitOS validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime entrypoint
        run: |
          test -f index.html
          grep -q "OrbitOS" index.html
          grep -q "orbit-v4" index.html
          grep -q "function approve" index.html
          grep -q "browser-bridge" index.html
          echo "Runtime checks passed"

      - name: Validate architecture
        run: |
          test -f docs/ARCHITECTURE.md
          test -f docs/AGENTS.md
          test -f docs/ENGINEERING.md
          test -f supabase/schema.sql
          echo "Architecture checks passed"

      - name: Validate modular core files
        run: |
          test -f src/domain/models.mjs
          test -f src/domain/state.mjs
          test -f src/core/pipeline.mjs
          test -f src/core/audit.mjs
          test -f src/core/runtime.mjs
          test -f src/contracts/adapters.mjs
          test -f src/contracts/ai.mjs
          test -f src/adapters/local-store.mjs
          test -f src/adapters/local-content-generator.mjs
          test -f src/adapters/local-research.mjs
          test -f src/adapters/local-metrics.mjs
          test -f src/adapters/null-publisher.mjs
          test -f src/adapters/ollama-text-model.mjs
          test -f src/adapters/ollama-content-generator.mjs
          test -f src/runtime/ui-state.mjs
          test -f src/runtime/browser-bridge.mjs
          test -f src/agents/orchestrator.mjs
          test -f src/agents/research.mjs
          test -f src/agents/strategy.mjs
          test -f src/agents/writing.mjs
          test -f src/agents/creative.mjs
          test -f src/agents/review.mjs
          test -f src/agents/analytics.mjs
          test -f src/agents/learning.mjs
          test -f tests/smoke.mjs
          test -f tests/contracts.mjs
          test -f tests/runtime.mjs
          test -f tests/browser-bridge.mjs
          test -f tests/agents.mjs
          test -f tests/local-ai.mjs

      - name: Run smoke tests
        run: node tests/smoke.mjs

      - name: Run adapter contract tests
        run: node tests/contracts.mjs

      - name: Run runtime integration tests
        run: node tests/runtime.mjs

      - name: Run browser bridge tests
        run: node tests/browser-bridge.mjs

      - name: Run agent tests
        run: node tests/agents.mjs

      - name: Run local AI adapter tests
        run: node tests/local-ai.mjs
