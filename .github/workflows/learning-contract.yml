name: learning-contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  learning-next-moves:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run learning next-moves contract tests
        run: node tests/learning-next-moves-contract.mjs
