# Only this function skips the platform JWT check because its handler
# validates a Supabase secret API key via @supabase/server (auth: "secret").
[functions.publishing-worker]
verify_jwt = false

# The OAuth callback receives a Meta browser redirect rather than a Supabase JWT.
# Its handler validates a single-use state token before accessing sensitive state.
[functions.instagram-oauth-callback]
verify_jwt = false

# Start is called from a signed-in OrbitOS session and retains default JWT checks.
[functions.instagram-oauth-start]
verify_jwt = true

# Server-only token maintenance. Custom Supabase secret-key authentication is
# checked by @supabase/server; this does not accept normal user JWTs.
[functions.instagram-token-refresh]
verify_jwt = false

# Manual publish-outcome reconciliation is a signed-in owner/admin operation.
[functions.publishing-reconciliation]
verify_jwt = true
